# 注意：本机 shell 的 `ulimit -v` 硬上限是 4 GiB（不可提升），
# 所以 JVM 的「堆 + 元空间 + 压缩类空间 + 代码缓存」必须整体压在 4 GiB 以内，
# 否则 Gradle 守护进程会以 “Could not allocate compressed class space” 起不来。
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:CompressedClassSpaceSize=192m -XX:ReservedCodeCacheSize=128m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true

# --- NeoForge 目标 ---
# 与原版 Forge 1.20.1 分支（chunksmith_modern_gui-1.0.4-r23.jar）功能一致，
# 只换加载器与 Minecraft 版本。
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.249
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# --- 模组元数据 ---
mod_id=chunksmith_modern_gui
mod_name=Chunksmith modern gui
# jar 名带 neoforge/1.21.1 后缀，避免和 Forge 1.20.1 版本的同名产物混淆
mod_archive_name=chunksmith_modern_gui-neoforge-1.21.1
mod_license=MIT
mod_version=1.0.4-r23
mod_group_id=cn.blockforge.generated.chunksmithchunksmithgu
mod_authors=BarryAlen777
# 注意：模组描述（含中文）不在这里，而是直接写在
# src/main/templates/META-INF/neoforge.mods.toml 里——gradle.properties 按 ISO-8859-1
# 解析，中文放这里会变成乱码。
